name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  java:
    name: Java build + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # `sh gradlew` works on both OS and does not depend on the exec bit
      # (gradlew is committed as 100644). `build` runs `check`, which on this
      # branch is wired to the 15 zero-dependency `verifyXxx` JavaExec
      # self-checks instead of JUnit (26.3 dropped JUnit — maven.neoforged.net
      # is unreachable from the build machine). Compiles against the real
      # MC 26.3 classes from the neoform dev runtime — no game client needed.
      - name: Build + tests
        shell: bash
        run: sh gradlew build

  python:
    name: Python suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # Discovery over backend/tests itself — an explicit module list rots
      # (this job used to name 7 modules that do not exist on 26.3).
      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests

  integration:
    name: Java wire fixture ⇄ Python backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      # The only test that proves the two sides actually talk to each other.
      # It launches `gradlew runWireFixture` itself — the headless fixture
      # (`src/test/java/.../WireServerFixtureMain`, test source set, never in
      # the mod jar) runs the **production** WireServer with no game client —
      # and drives it through the real `protocol.wire_client.WireClient`.
      # No `tests/integration/__init__.py` on purpose: `discover -s tests`
      # skips non-package directories, so the 1103-test unit suite keeps its
      # "zero skips" baseline and this heavier test is run here, explicitly.
      # Needs no pip install: the test imports only stdlib + protocol.wire_client.
      #
      # The unit suite runs *first, in this same job* on purpose: if the wire
      # fixture fails, the transcript above it still shows whether the 1103
      # unit tests were green, so "unit green / integration red" is readable
      # instead of being hidden by a broken fixture.
      - name: Backend unit suite (baseline, 1103 tests, zero skips)
        shell: bash
        run: python -m unittest discover -s tests
      - name: Boot the real WireServer and drive it from the backend
        shell: bash
        run: python -m unittest discover -s tests/integration -t tests/integration -v
