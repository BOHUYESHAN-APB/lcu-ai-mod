name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  java:
    name: Java build + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # `sh gradlew` works on both OS and does not depend on the exec bit
      # (gradlew is committed as 100644). `build` runs `check`, which on this
      # branch is wired to the 13 zero-dependency `verifyXxx` JavaExec
      # self-checks instead of JUnit (26.3 dropped JUnit — maven.neoforged.net
      # is unreachable from the build machine). Compiles against the real
      # MC 26.3 classes from the neoform dev runtime — no game client needed.
      - name: Build + tests
        shell: bash
        run: sh gradlew build

  python:
    name: Python suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # Discovery over backend/tests itself — an explicit module list rots
      # (this job used to name 7 modules that do not exist on 26.3).
      - name: Run tests
        shell: bash
        run: python -m unittest discover -s tests

  # No `integration` job: it ran `gradlew runWireFixture`, a task 26.3 does not
  # have (the headless Java fixture `WireServerFixtureMain` went away with the
  # JUnit-era test sources), so it could only ever fail and hide real
  # regressions. Python-side wire checks stay in test_wire_encoding.py and
  # test_wire_contract_block_tools.py; standing the real end-to-end fixture
  # back up means rewriting it against 26.3's WireServer (see
  # docs/dev/PORT_LIST.md).
