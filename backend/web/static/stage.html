<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LCU 叠加层 · Stage</title>
<style>
/* ── 单页叠加层（OBS 里只加一个浏览器源）────────────────────────────────────
   不写死尺寸：所有尺寸都由 --u = max(9px, 1.9vmin) 派生（vmin 跟随源实际大小），
   再乘布局里的 scale ⇒ 源拉多大都不糊、不溢出、不会错位。
   背景：`?bg=transparent` ⇒ 真透明（OBS 用这个）；缺省/其它值 ⇒ 深色底（浏览器预览）。
   布局来自 GET /api/overlay/layout（x/y 为视口百分比），数据来自 GET /api/overlay/data。 */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
:root{--u:max(9px,1.9vmin)}
body{background:#0f1216;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
html.bg-transparent,html.bg-transparent body{background:transparent}
#stage{position:absolute;inset:0}
body.offline #stage{opacity:.32}

/* 组件容器：绝对定位 + 字号即缩放（文字保持清晰，不用 transform）。 */
.cmp{position:absolute;font-size:calc(var(--s,1) * var(--u));line-height:1.25;color:#e6edf3;
  text-shadow:0 1px 2px rgba(0,0,0,.9);white-space:nowrap}

/* 像素/方块感面板：2px 黑框 + 内侧高光，视频叠加可读性优先。 */
.panel{display:flex;flex-direction:column;gap:.3em;padding:.4em .55em;border:2px solid #05070a;border-radius:2px;
  background:linear-gradient(180deg,rgba(22,27,34,.82),rgba(9,11,15,.86));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.06),3px 3px 0 rgba(0,0,0,.45)}
.ttl{font-size:.68em;font-weight:700;letter-spacing:.16em;color:#9db2c7;text-transform:uppercase}

/* 通用条形（耐久/生命/进度…）：纯 CSS，带像素刻度纹理。 */
.bar{position:relative;display:block;height:.46em;background:rgba(0,0,0,.62);border:1px solid #05070a;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);border-radius:1px;overflow:hidden}
.bar[hidden]{display:none}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:0;background-color:#5ac54f;transition:width .18s linear;
  background-image:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 55%),
                   repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 1px,transparent 1px 4px)}
.num{font-size:.56em;color:#a9b6c4;font-variant-numeric:tabular-nums;white-space:nowrap}

/* 物品图标框：图未加载成功前 img 是 hidden，永久 404 的退成语义文字（绝不显示破图）。 */
.ico{width:2.4em;height:2.4em;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);border-radius:2px}
.ico img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.ico .fb{font-size:.55em;color:#95a3b3;text-align:center;line-height:1.1;padding:0 .12em;
  word-break:break-all;white-space:normal;text-shadow:none}
.ico.has .fb{display:none}

/* gear：四个盔甲槽排开，各自带耐久。 */
.slots{display:flex;gap:.5em;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:center;gap:.14em;min-width:2.7em}
.slot .nm{font-size:.56em;max-width:3.8em;overflow:hidden;text-overflow:ellipsis;color:#cfd9e4}
.slot .bar{align-self:stretch;width:100%}
.slot.empty .ico{opacity:.42}
.slot.empty .nm{color:#7d8794}

/* weapon：主手/副手，各带耐久。 */
.wrow{display:flex;align-items:center;gap:.45em;min-width:8em}
.wrow .ico{width:2em;height:2em}
.wb{display:flex;flex-direction:column;gap:.14em;min-width:5.5em;flex:1 1 auto}
.whead{display:flex;align-items:baseline;gap:.3em}
.whead .hand{font-size:.55em;color:#8b949e;letter-spacing:.05em}
.whead .nm{font-size:.72em}
.whead .ct{font-size:.6em;color:#8b949e}
.wrow.empty .wb{opacity:.55}

/* vitals：三根条 + 数字。 */
.vitals{min-width:11em}
.vrow{display:flex;align-items:center;gap:.35em}
.vrow .vlab{font-size:.6em;color:#9db2c7;min-width:2.6em}
.vrow .bar{flex:1 1 auto;min-width:4.5em}
.vrow .num{min-width:4.2em;text-align:right}

/* task：kind/status/detail/progress。 */
.task{min-width:11em}
.tline{display:flex;align-items:baseline;gap:.35em}
.tline .tk{font-size:.78em;font-weight:700;color:#e6edf3}
.tline .ts{font-size:.6em;letter-spacing:.08em;text-transform:uppercase}
.tdet{font-size:.62em;color:#a9b6c4;white-space:normal;max-width:13em;overflow-wrap:anywhere}
.task .bar{align-self:stretch}

/* 低调状态提示（未连接 / 后端未响应 / 布局接口不可用）：底部居中，不抢画面。 */
#note{position:absolute;left:50%;bottom:var(--u);transform:translateX(-50%);z-index:9;
  font-size:max(10px,1.5vmin);color:#e3b341;background:rgba(0,0,0,.7);border:1px solid rgba(227,179,65,.45);
  padding:.2em .7em;letter-spacing:.04em;white-space:nowrap;max-width:96vw;overflow:hidden;text-overflow:ellipsis}
#note[hidden]{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="note" hidden></div>
<script>
"use strict";
(function () {
  /* OBS 透明底：只在明确写 ?bg=transparent 时透明；其余情况留深色底方便浏览器里预览。 */
  var bgParam = (new URLSearchParams(location.search).get("bg") || "").trim().toLowerCase();
  if (bgParam === "transparent") document.documentElement.classList.add("bg-transparent");

  var stage = document.getElementById("stage");
  var noteEl = document.getElementById("note");

  /* ── 可见性门 ─────────────────────────────────────────────────────────
     OBS 里这个源被切到别的场景 / 浏览器最小化时**不干活**：登记的定时器全部
     clearInterval（真·0 次唤醒），回来时立刻各补一次 —— 该实时的时候一字不改。 */
  var VIS = (function () {
    var hidden = !!document.hidden;
    var resumeHooks = [], timers = [];
    function every(ms, fn) {
      var id = null, period = ms;
      function start() { if (id === null && !hidden) id = setInterval(fn, period); }
      function stop() { if (id !== null) { clearInterval(id); id = null; } }
      var slot = { start: start, stop: stop,
                   set: function (ms2) { var on = id !== null; stop(); period = ms2; if (on) start(); } };
      timers.push(slot);
      start();
      return slot;
    }
    document.addEventListener("visibilitychange", function () {
      var was = hidden;
      hidden = !!document.hidden;
      if (was === hidden) return;
      if (hidden) { timers.forEach(function (t) { t.stop(); }); }
      else {
        timers.forEach(function (t) { t.start(); });
        resumeHooks.forEach(function (fn) { try { fn(); } catch (e) {} });
      }
    });
    return { running: function () { return !hidden; },
             onResume: function (fn) { resumeHooks.push(fn); },
             every: every };
  })();

  var ARMOR = ["head", "chest", "legs", "feet"];
  var SLOT_FB = { head: "头盔", chest: "胸甲", legs: "护腿", feet: "靴子" };
  var STATUS_C = { running: "#58a6ff", queued: "#d29922", pending: "#d29922",
                   done: "#3fb950", failed: "#f85149", cancelled: "#8b949e", canceled: "#8b949e" };
  /* 布局接口不可用时的兜底（会同时打出显式警告，不会静默假装这是用户布局）。 */
  var DEFAULT_LAYOUT = { version: 1, components: [
    { kind: "gear", x: 2, y: 3, scale: 1, opacity: 1, visible: true },
    { kind: "vitals", x: 2, y: 17, scale: 1, opacity: 1, visible: true },
    { kind: "weapon", x: 2, y: 33, scale: 1, opacity: 1, visible: true },
    { kind: "task", x: 2, y: 49, scale: 1, opacity: 1, visible: true }
  ] };

  function mk(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function n(v, def) { var x = Number(v); return isFinite(x) ? x : def; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  /* 缺失/非法一律回 null（条形隐藏），绝不拿默认值顶替真实数据。 */
  function ratio(v, max) {
    var a = Number(v), b = Number(max);
    return (isFinite(a) && isFinite(b) && b > 0) ? clamp(a / b, 0, 1) : null;
  }
  function txt(v) { var x = Number(v); return isFinite(x) ? String(Math.round(x * 10) / 10) : "–"; }
  /* 有值才写「当前 / 上限」；字段缺失就只写 "–"（不拿默认值凑成分母）。 */
  function show(v, max) {
    var a = Number(v), b = Number(max);
    return (isFinite(a) && isFinite(b) && b > 0) ? txt(a) + " / " + txt(b) : "–";
  }
  function durColor(p) { return "hsl(" + Math.round(120 * p) + ",78%,45%)"; }
  function bar() {
    var el = mk("span", "bar"), i = mk("i");
    el.append(i);
    return { el: el, set: function (p, c) {
      if (p == null) { el.hidden = true; i.style.width = "0"; return; }
      el.hidden = false; i.style.width = (p * 100).toFixed(1) + "%";
      if (c) i.style.backgroundColor = c;
    } };
  }

  /* ── 原版贴图：/api/icon/<item_id>；拿不到就退语义文字，永不显示破图 ──────────
     img 初始 hidden，只有 onload 成功才显示；404 记进缓存不再重复请求（免得每 220ms
     刷一串 404）。连接状态从断→通时清缓存，重新给贴图一次机会。 */
  var iconCache = new Map();
  var ICON_CACHE_MAX = 512;   // 贴图结果缓存不许随"见过的物品"无限涨
  function cacheIcon(id, v) {
    iconCache.delete(id);
    iconCache.set(id, v);
    while (iconCache.size > ICON_CACHE_MAX) iconCache.delete(iconCache.keys().next().value);
  }
  function makeIcon() {
    var box = mk("div", "ico"), img = mk("img"), fb = mk("span", "fb");
    img.alt = ""; img.decoding = "async"; img.hidden = true;
    box.append(img, fb);
    box._img = img; box._fb = fb; box._id = null;
    return box;
  }
  function setIcon(box, id, fbLabel, nameEl) {
    if (box._fb.textContent !== fbLabel) box._fb.textContent = fbLabel;
    id = id ? String(id) : "";
    if (box._id === id) { syncName(); return; }
    box._id = id;
    var img = box._img;
    img.hidden = true; img.removeAttribute("src"); box.classList.remove("has");
    syncName();
    if (!id || iconCache.get(id) === "bad") return;
    img.onload = function () {
      if (box._id !== id) return;
      img.hidden = false; box.classList.add("has"); cacheIcon(id, "ok"); syncName();
    };
    img.onerror = function () { img.hidden = true; box.classList.remove("has"); cacheIcon(id, "bad"); syncName(); };
    img.src = "/api/icon/" + encodeURIComponent(id);
    /* 有贴图 ⇒ 框里是图、名字在右边；没贴图 ⇒ 框里就是名字（避免和"主手/副手"标签重复）。 */
    function syncName() { if (nameEl) nameEl.hidden = !box.classList.contains("has"); }
  }

  /* ── 四个组件：build() 只建一次 DOM，update(data) 只改文本/宽度 ─────────────
     ⚠ 这一整块（mk/n/clamp/ratio/txt/show/durColor/bar/makeIcon/setIcon/fillHand/build*）
     与 overlay_editor.html 里的同名块是**同一份逻辑**：两页都要求"单文件、零外部依赖"，
     所以只能各存一份 —— 改这里务必同步改那边，否则预览和 OBS 输出会不一致。 */
  function buildGear() {
    var root = mk("div", "cmp"), panel = mk("div", "panel");
    panel.append(mk("div", "ttl", "装备"));
    var row = mk("div", "slots"); panel.append(row); root.append(panel);
    var slots = {};
    ARMOR.forEach(function (s) {
      var cell = mk("div", "slot"), ico = makeIcon(), b = bar(), nm = mk("span", "nm", ""), num = mk("b", "num", "");
      cell.append(ico, nm, b.el, num); row.append(cell);
      slots[s] = { cell: cell, ico: ico, nm: nm, bar: b, num: num };
    });
    return { el: root, update: function (d) {
      var armor = (d && d.gear && Array.isArray(d.gear.armor)) ? d.gear.armor : [];
      ARMOR.forEach(function (s) {
        var r = slots[s], a = null;
        for (var i = 0; i < armor.length; i++) { if (armor[i] && armor[i].slot === s) { a = armor[i]; break; } }
        var id = (a && a.item_id) ? String(a.item_id) : "";
        setIcon(r.ico, id, SLOT_FB[s]);
        if (!id) { /* 空槽（后端给全零对象）：只留暗框，不画耐久条 */
          r.cell.classList.add("empty"); r.nm.textContent = "空";
          r.bar.set(null); r.num.textContent = "";
          return;
        }
        r.cell.classList.remove("empty");
        var c = n(a.count, 1);
        r.nm.textContent = (a.name || id) + (c > 1 ? " ×" + c : "");
        var p = (a.damageable === false) ? null : ratio(a.durability, a.max_durability);
        r.bar.set(p, p == null ? null : durColor(p));
        r.num.textContent = (p == null) ? "" : txt(a.durability) + "/" + txt(a.max_durability);
      });
    } };
  }

  function fillHand(h, it, fb) {
    var id = (it && it.item_id) ? String(it.item_id) : "";
    var nl = id ? String(it.name || id) : "空";
    setIcon(h.ico, id, nl, h.nm);          // 没贴图时：框里显示名字，右侧名字让位
    h.nm.textContent = nl;
    if (!id) {
      h.row.classList.add("empty"); h.ct.textContent = "";
      h.bar.set(null); h.num.textContent = "";
      return;
    }
    h.row.classList.remove("empty");
    var c = n(it.count, 1);
    h.ct.textContent = c > 1 ? "×" + c : "";
    var p = (it.damageable === false) ? null : ratio(it.durability, it.max_durability);
    h.bar.set(p, p == null ? null : durColor(p));
    h.num.textContent = (p == null) ? "" : txt(it.durability) + "/" + txt(it.max_durability);
  }

  function buildWeapon() {
    var root = mk("div", "cmp"), panel = mk("div", "panel");
    panel.append(mk("div", "ttl", "武器"));
    function hand(label) {
      var row = mk("div", "wrow"), ico = makeIcon(), wb = mk("div", "wb");
      var head = mk("div", "whead"), nm = mk("span", "nm", ""), ct = mk("span", "ct", "");
      head.append(mk("span", "hand", label), nm, ct);
      var b = bar(), num = mk("b", "num", "");
      wb.append(head, b.el, num); row.append(ico, wb);
      return { row: row, ico: ico, nm: nm, ct: ct, bar: b, num: num };
    }
    var main = hand("主手"), off = hand("副手");
    panel.append(main.row, off.row); root.append(panel);
    return { el: root, update: function (d) {
      var g = (d && d.gear) || {};
      fillHand(main, g.main_hand, "主手");
      fillHand(off, g.off_hand, "副手");
    } };
  }

  function buildVitals() {
    var root = mk("div", "cmp"), panel = mk("div", "panel vitals");
    panel.append(mk("div", "ttl", "状态"));
    var rows = {};
    /* 20 = 原版饥饿值/饱和度上限（/api/overlay/data 只给当前值，分母用原版常量并写死在数字里）。 */
    [["health", "生命", "#e5484d"], ["food", "饥饿", "#c9822a"], ["sat", "饱和", "#d4b13e"]]
      .forEach(function (spec) {
        var r = mk("div", "vrow"), b = bar(), num = mk("b", "num", "");
        r.append(mk("span", "vlab", spec[1]), b.el, num);
        panel.append(r);
        rows[spec[0]] = { bar: b, num: num, color: spec[2] };
      });
    root.append(panel);
    return { el: root, update: function (d) {
      var v = (d && d.vitals) || {};
      rows.health.bar.set(ratio(v.health, v.max_health), rows.health.color);
      rows.health.num.textContent = show(v.health, v.max_health);
      rows.food.bar.set(ratio(v.food, 20), rows.food.color);
      rows.food.num.textContent = show(v.food, 20);
      rows.sat.bar.set(ratio(v.saturation, 20), rows.sat.color);
      rows.sat.num.textContent = show(v.saturation, 20);
    } };
  }

  function buildTask() {
    var root = mk("div", "cmp"), panel = mk("div", "panel task");
    panel.append(mk("div", "ttl", "任务"));
    var line = mk("div", "tline"), tk = mk("span", "tk", ""), ts = mk("span", "ts", "");
    line.append(tk, ts);
    var det = mk("div", "tdet", ""), b = bar();
    panel.append(line, det, b.el); root.append(panel);
    return { el: root, update: function (d) {
      var t = (d && d.task) || null;
      if (!t || (!t.kind && !t.status && !t.detail)) {
        tk.textContent = "无任务"; ts.textContent = ""; ts.removeAttribute("style"); det.textContent = "";
        b.set(null);
        return;
      }
      tk.textContent = t.kind || "–";
      ts.textContent = t.status || "–";
      ts.style.color = STATUS_C[t.status] || "#8b949e";
      det.textContent = t.detail || "";
      var pr = Number(t.progress);
      b.set(isFinite(pr) ? clamp(pr, 0, 1) : null, "#58a6ff");
    } };
  }

  var BUILD = { gear: buildGear, weapon: buildWeapon, vitals: buildVitals, task: buildTask };
  var live = {};              // kind -> {el, update}（只放 visible 的组件）
  var data = null, offline = false, connState = null, layoutKey = "";
  var notes = {};

  function setNote(key, msg) {
    if (msg) notes[key] = msg; else delete notes[key];
    var all = Object.keys(notes).map(function (k) { return notes[k]; });
    var text = all.join(" · ");
    if (noteEl.textContent === text && noteEl.hidden === (all.length === 0)) return;   // 没变就不写
    noteEl.textContent = text;
    noteEl.hidden = all.length === 0;
  }

  function buildLayout(layout) {
    stage.textContent = "";
    live = {};
    var list = (layout && Array.isArray(layout.components)) ? layout.components : [];
    list.forEach(function (c) {
      if (!c || !BUILD[c.kind] || c.visible === false) return;   // 不渲染的组件 = 不占位
      var m = BUILD[c.kind]();
      m.el.style.left = n(c.x, 0) + "%";
      m.el.style.top = n(c.y, 0) + "%";
      m.el.style.setProperty("--s", String(clamp(n(c.scale, 1), 0.2, 8)));
      m.el.style.opacity = String(clamp(n(c.opacity, 1), 0, 1));
      stage.append(m.el);
      live[c.kind] = m;
    });
    render();
  }

  function render() {
    Object.keys(live).forEach(function (k) {
      try { live[k].update(data || {}); }
      catch (e) { setNote("render", "组件渲染出错：" + k); }
    });
  }

  var busy = false;
  var lastRaw = null;   // /api/overlay/data 的原始 JSON：一样就一次 DOM 都不碰
  function tick() {
    if (busy) return;
    busy = true;
    fetch("/api/overlay/data", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (raw) {
        if (offline) { offline = false; document.body.classList.remove("offline"); }
        var d = JSON.parse(raw);
        var conn = !(d && d.connected === false);
        if (connState === false && conn) iconCache.clear();   // 重新连上：贴图再试一次
        connState = conn;
        setNote("conn", conn ? "" : "未连接游戏 — 显示后端最后快照");
        if (raw === lastRaw) return;   // 数据没变（后端每 220ms 才轮一次，多半没变）：不重绘
        lastRaw = raw;
        data = d || {};
        render();
      })
      .catch(function (e) {
        if (!offline) { offline = true; document.body.classList.add("offline"); }
        setNote("conn", "后端未响应（" + (e && e.message ? e.message : "网络错误") + "）— 画面已停更");
      })
      .then(function () { busy = false; });
  }

  function tickLayout() {
    fetch("/api/overlay/layout", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) {
        setNote("layout", "");
        var key = JSON.stringify(j);
        if (key === layoutKey) return;
        layoutKey = key;
        buildLayout(j);
      })
      .catch(function () {
        if (layoutKey) return;      // 已经有过布局：保留，别把用户布局替换成默认
        layoutKey = "builtin";
        buildLayout(DEFAULT_LAYOUT);
        setNote("layout", "布局接口不可用 — 暂用内置默认布局");
      });
  }

  tickLayout();
  tick();
  VIS.every(5000, tickLayout);   // 编辑器保存后，OBS 里的页面自己换上（无需重加源）
  VIS.every(220, tick);          // ~4.5 次/秒；隐藏时定时器被停掉
  VIS.onResume(function () { tick(); tickLayout(); });   // 回来立刻补一次，不留空窗
