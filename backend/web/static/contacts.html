<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>私信 · 通讯录</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* OBS 外观变量：缺省值 = 现有深色底（默认外观完全不变）；html.ov-transparent 时
   全部表面转真透明（bg 参数或仪表盘保存的默认值触发）。 */
:root{--ov-bg:#0d1117;--ov-surface:#161b22;--ov-line:#30363d}
html.ov-transparent{--ov-bg:transparent;--ov-surface:transparent;--ov-line:transparent}
html.ov-transparent,html.ov-transparent body,html.ov-transparent .topbar,
html.ov-transparent .contacts,html.ov-transparent .chat-head,html.ov-transparent .chat-foot,
html.ov-transparent .chat-body,html.ov-transparent .group-title{background:transparent;box-shadow:none}
html,body{height:100%}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  background:var(--ov-bg,#0d1117);color:var(--ov-fg,#c9d1d9);display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ov-surface,#161b22);
  border-bottom:1px solid var(--ov-line,#30363d);flex-shrink:0}
.topbar .title{font-size:15px;font-weight:700;color:var(--ov-accent,#58a6ff)}
.topbar .title span{color:#8b949e;font-weight:400;font-size:12px}
.topbar .spacer{flex:1}
.status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px}
.status.online{background:rgba(63,185,80,.15);color:#3fb950}
.status.offline{background:rgba(139,148,158,.15);color:#8b949e}
.btn{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;
  padding:6px 12px;font-size:12px;cursor:pointer}
.btn:hover{background:#30363d}
.btn.primary{background:#1f6feb;color:#fff;border-color:#1f6feb}
.btn.primary:hover{background:#388bfd}
.layout{flex:1;display:grid;grid-template-columns:minmax(230px,.72fr) minmax(340px,1.28fr);min-height:0}
/* ── 左栏：联系人列表（头像 / 名字 / 层级 / 未读徽标 / 最后一条预览 + 时间）── */
.contacts{border-right:1px solid var(--ov-line,#30363d);overflow-y:auto;background:var(--ov-bg,#0d1117)}
.group-title{padding:8px 14px;font-size:11px;color:#8b949e;background:var(--ov-surface,#161b22);
  border-bottom:1px solid #21262d;position:sticky;top:0;z-index:1}
.contact{width:100%;display:block;text-align:left;background:transparent;
  color:var(--ov-fg,#c9d1d9);border:0;border-bottom:1px solid #21262d;padding:9px 12px;cursor:pointer}
.contact:hover,.contact.active{background:#21262d}
.contact .rowtop{display:flex;align-items:center;gap:9px}
.contact .av{width:36px;height:36px;border-radius:6px;background:#30363d;flex:0 0 36px;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;
  user-select:none;overflow:hidden}
.contact .rowmain{flex:1;min-width:0}
.contact .line1{display:flex;align-items:center;gap:6px}
.contact .nm{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact .tier{font-size:10px;border-radius:3px;padding:1px 5px;border:1px solid #30363d;color:#8b949e}
.tier.master{color:#d29922;border-color:#d29922}
.tier.friend{color:#58a6ff;border-color:#58a6ff}
.tier.guest{color:#8b949e;border-color:#30363d}
.contact .badge{background:#da3633;color:#fff;border-radius:9px;
  min-width:17px;text-align:center;font-size:10px;padding:1px 5px}
.contact .preview{font-size:11px;color:#8b949e;margin-top:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.contact .ts{font-size:10px;color:#8b949e;flex:0 0 auto;align-self:flex-start}
.contact .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#8b949e}
.contact .dot.on{background:#3fb950}
/* ── 右栏：会话（别人靠左 / AI 靠右；连续消息成组；时间按分钟分组）── */
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-head{padding:10px 14px;border-bottom:1px solid var(--ov-line,#30363d);background:var(--ov-surface,#161b22);flex-shrink:0;
  display:flex;align-items:center;gap:8px}
.chat-head .nm{font-weight:600}
.chat-head .meta{font-size:11px;color:#8b949e}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:1px;min-height:0}
.timesep{align-self:center;margin:8px 0 6px;font-size:10px;color:#8b949e;background:rgba(110,118,129,.18);
  border-radius:4px;padding:2px 8px}
.line{display:flex;gap:8px;align-items:flex-start;margin-top:2px}
.line.out{flex-direction:row-reverse}
.line.first{margin-top:10px}
.av{width:32px;height:32px;flex:0 0 32px;border-radius:5px;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-weight:700;color:#fff;background:#30363d;user-select:none;overflow:hidden}
.av.spacer{background:transparent;color:transparent}
.av.ai{background:linear-gradient(135deg,#1f6feb,#3fb950)}
.stack{display:flex;flex-direction:column;min-width:0;max-width:76%}
.line.out .stack{align-items:flex-end}
.who{font-size:10px;color:#8b949e;margin:0 2px 3px}
.bubble{position:relative;padding:7px 10px;border-radius:6px;font-size:13px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.bubble.in{background:#262c36;color:#e6edf3}
.bubble.out{background:#1f6feb;color:#fff}
/* 小尾巴：只挂在同一组的**第一条**（挨着头像那条）上，指向头像。 */
.bubble.tail::before{content:'';position:absolute;top:9px;border:5px solid transparent}
.bubble.in.tail::before{left:-8px;border-right-color:#262c36}
.bubble.out.tail::before{right:-8px;border-left-color:#1f6feb}
.bubble .stamp{font-size:9px;color:#8b949e;margin-top:3px;text-align:right}
.bubble.out .stamp{color:rgba(255,255,255,.72)}
.relabel{font-size:9px;margin-left:6px;color:rgba(255,255,255,.78)}
.jump{align-self:center;font-size:11px;background:#1f6feb;color:#fff;border:0;border-radius:12px;
  padding:3px 12px;cursor:pointer;margin:4px 0}
.chat-foot{border-top:1px solid var(--ov-line,#30363d);padding:9px 12px;background:var(--ov-surface,#161b22);flex-shrink:0}
.chat-input{display:flex;gap:8px;align-items:flex-end}
.chat-input textarea{flex:1;resize:none;height:42px;max-height:120px;background:var(--ov-bg,#0d1117);border:1px solid #30363d;
  border-radius:6px;padding:9px 10px;color:var(--ov-fg,#c9d1d9);font-size:13px;font-family:inherit;line-height:1.4}
.chat-input textarea:focus{border-color:#58a6ff;outline:none}
.empty{padding:24px;color:#8b949e;font-size:12px;text-align:center}
.hint{font-size:11px;color:#8b949e;margin-top:6px;line-height:1.5}
</style>
<script>
/* ── OBS 外观（bg / fg / accent / font_scale）──────────────────────────────
   优先级：URL 参数 > 服务端保存的默认值(/api/overlay/theme) > 页面内置默认。
   非法值一律忽略 → 回退下一层，绝不白屏/报错；值只经 style.setProperty 落到 CSS，
   从不拼进 HTML 文本（防注入）。不传参数且未保存过 ⇒ 外观与以前完全一致。 */
(function () {
  var COLOR = /^(#[0-9a-fA-F]{3}|#[0-9a-fA-F]{6}|rgba?\(\s*[0-9.]+%?\s*,\s*[0-9.]+%?\s*,\s*[0-9.]+%?\s*(?:,\s*[0-9.]+\s*)?\))$/;
  function color(v) { return typeof v === 'string' && COLOR.test(v.trim()) ? v.trim() : ''; }
  function bgOf(v) { if (typeof v !== 'string') return ''; var t = v.trim(); return t === 'transparent' ? t : color(t); }
  function scaleOf(v) { var n = parseFloat(v); return (isFinite(n) && n > 0) ? Math.max(0.25, Math.min(8, n)) : null; }
  var root = document.documentElement;
  function apply(theme) {
    theme = theme || {};
    var bg = bgOf(theme.bg), fg = color(theme.fg), ac = color(theme.accent), fs = scaleOf(theme.font_scale);
    root.classList.toggle('ov-transparent', bg === 'transparent');
    if (bg && bg !== 'transparent') { root.classList.add('ov-bg'); root.style.setProperty('--ov-bg', bg); }
    else { root.classList.remove('ov-bg'); root.style.removeProperty('--ov-bg'); }
    if (fg) root.style.setProperty('--ov-fg', fg); else root.style.removeProperty('--ov-fg');
    if (ac) root.style.setProperty('--ov-accent', ac); else root.style.removeProperty('--ov-accent');
    if (fs) root.style.setProperty('--ov-font-scale', String(fs)); else root.style.removeProperty('--ov-font-scale');
  }
  var params = new URLSearchParams(location.search);
  var KEYS = ['bg', 'fg', 'accent', 'font_scale'];
  function merge(stored) {
    var theme = {};
    for (var i = 0; i < KEYS.length; i++) {
      var k = KEYS[i];
      theme[k] = params.has(k) ? params.get(k) : (stored && stored[k] != null ? stored[k] : '');
    }
    apply(theme);
  }
  merge(null);
  try {
    fetch('/api/overlay/theme', {cache: 'no-store'})
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { merge(d && d.theme ? d.theme : null); })
      .catch(function () {});
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="topbar">
  <div class="title">私信 <span>通讯录</span></div>
  <div class="spacer"></div>
  <span id="conn" class="status offline">● 未连接</span>
  <a class="btn" href="/" style="text-decoration:none">返回仪表盘</a>
</div>
<div class="layout">
  <div id="contacts" class="contacts"><div class="empty">加载中…</div></div>
  <div class="chat">
    <div class="chat-head">
      <span class="nm" id="peerName">未选择联系人</span>
      <span class="meta" id="peerMeta"></span>
    </div>
    <div class="chat-body" id="messages"><div class="empty">还没有私下聊过 —— 左侧选一个人，看你们的来往私信</div></div>
    <button id="jump" class="jump" style="display:none" onclick="scrollBottom(true)">有新消息 · 回到最新 ↓</button>
    <div class="chat-foot">
      <div class="chat-input">
        <textarea id="input" rows="1" placeholder="以 AI 的身份代发一条私信（回车发送 / Shift+回车换行；会过服务端出站清洗 + 指令白名单）"></textarea>
        <button class="btn primary" onclick="sendMessage()">发送</button>
      </div>
      <div class="hint" id="sendHint">代发＝<b>以 AI 的身份</b>发出去（不是以你的名义）；走 POST /api/contacts/&lt;uuid&gt;/send。</div>
    </div>
  </div>
</div>
<script>
"use strict";
const state = { contacts: [], current: null, currentKey: null, messages: [], sending: false,
                atBottom: true, aiName: 'AI', aiNameChecked: false };
// 两个列表都只留最近 N 条；各配一个指纹——内容没变就不重写整段 innerHTML。
const MSG_MAX = 300;
let contactsKey = '', messagesKey = '';

/* ── 可见性门 ─────────────────────────────────────────────────────────
   页面被切走 / 最小化：轮询定时器直接清掉（真·0 次唤醒），/ws 消息不处理；
   回来时立刻补一次并接回 WS —— 看得见的时候行为一字不改。 */
const VIS = (() => {
  let hidden = !!document.hidden;
  const resumeHooks = [], timers = [];
  function every(ms, fn) {
    let id = null, period = ms;
    const start = () => { if (id === null && !hidden) id = setInterval(fn, period); };
    const stop = () => { if (id !== null) { clearInterval(id); id = null; } };
    const slot = { start, stop, set(ms2) { const on = id !== null; stop(); period = ms2; if (on) start(); } };
    timers.push(slot);
    start();
    return slot;
  }
  document.addEventListener('visibilitychange', () => {
    const was = hidden;
    hidden = !!document.hidden;
    if (was === hidden) return;
    if (hidden) { timers.forEach(t => t.stop()); }
    else { timers.forEach(t => t.start()); resumeHooks.forEach(fn => { try { fn(); } catch (e) {} }); }
  });
  return { running: () => !hidden, onResume(fn) { resumeHooks.push(fn); }, every };
})();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const pad2 = x => String(x).padStart(2, '0');
function fmtTime(ts) {
  const n = Number(ts);
  if (!isFinite(n) || n <= 0) return '';
  const d = new Date(n * 1000);
  return `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fmtClock(ts) {
  const n = Number(ts);
  if (!isFinite(n) || n <= 0) return '';
  const d = new Date(n * 1000);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
/* 左栏时间：今天＝HH:MM；昨天＝昨天；今年＝MM-DD；更早＝YYYY-MM-DD。 */
function listTime(ts) {
  const n = Number(ts);
  if (!isFinite(n) || n <= 0) return '';
  const d = new Date(n * 1000), now = new Date();
  if (d.toDateString() === now.toDateString()) return fmtClock(n);
  const yest = new Date(now.getTime() - 86400000);
  if (d.toDateString() === yest.toDateString()) return '昨天';
  if (d.getFullYear() === now.getFullYear()) return `${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
/* 头像：名字首字 + 由名字派生的稳定底色（**不加载任何外部图片/链接**）。 */
function avatarColor(name) {
  const s = String(name || '?');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
  return `hsl(${h},42%,38%)`;
}
function initial(name) { return (String(name || '?').trim().charAt(0) || '?').toUpperCase(); }
function avatarHtml(name, ai) {
  if (ai) return `<span class="av ai">AI</span>`;
  return `<span class="av" style="background:${avatarColor(name)}">${esc(initial(name))}</span>`;
}
async function api(path, options) {
  const r = await fetch(path, options);
  const data = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, data };
}

/* ── 左栏 ── */
function sameContact(c) {
  if (!state.current) return false;
  return [c.uuid, c.key, c.name].some(k => k && (k === state.current || k === state.currentKey));
}
function renderContacts() {
  const box = document.getElementById('contacts');
  const key = state.aiName + '|' + JSON.stringify(state.contacts);
  if (key === contactsKey) return;   // 没变就不重写（轮询每 5 秒都会走到这儿）
  contactsKey = key;
  if (!state.contacts.length) {
    box.innerHTML = '<div class="empty">还没有私下聊过的人。<br>等世界里的玩家先私信它。</div>';
    return;
  }
  const rows = state.contacts.map(c => {
    const tier = String(c.tier || '').toLowerCase();
    const active = sameContact(c) ? ' active' : '';
    const unread = Number(c.unread) || 0;
    const dir = c.last_direction === 'out' ? (state.aiName + '：') : '';
    return `<button class="contact${active}" onclick="selectContact('${esc(c.uuid || c.key)}')">
      <span class="rowtop">
        ${avatarHtml(c.name || c.uuid || '?', false)}
        <span class="rowmain">
          <span class="line1">
            <span class="dot ${c.online ? 'on' : ''}"></span>
            <span class="nm">${esc(c.name || c.uuid || '?')}</span>
            ${tier ? `<span class="tier ${esc(tier)}">${esc(tier)}</span>` : ''}
            ${unread ? `<span class="badge">${unread > 99 ? '99+' : unread}</span>` : ''}
          </span>
          <span class="preview">${esc(dir + (c.last_text || '（无内容）'))}</span>
        </span>
        <span class="ts">${esc(listTime(c.last_ts))}</span>
      </span>
    </button>`;
  }).join('');
  box.innerHTML = `<div class="group-title">联系人 · ${state.contacts.length}（本服）</div>${rows}`;
}

/* ── 右栏 ── */
/* 同一组 = 同一个说话人 + 同一分钟 + 间隔 < 5 分钟（微信那种"连着几句"）。 */
function sameRun(prev, m) {
  if (!prev || prev.direction !== m.direction) return false;
  const a = Number(prev.ts) || 0, b = Number(m.ts) || 0;
  return Math.floor(a / 60) === Math.floor(b / 60) && (b - a) < 300;
}
function minuteChanged(prev, m) {
  if (!prev) return true;
  return Math.floor((Number(prev.ts) || 0) / 60) !== Math.floor((Number(m.ts) || 0) / 60);
}
function dayChanged(prev, m) {
  if (!prev) return true;
  return new Date((Number(prev.ts) || 0) * 1000).toDateString()
      !== new Date((Number(m.ts) || 0) * 1000).toDateString();
}
/* 时间**按分钟分组**：同一分钟的连续消息共用一个时间标（挂在组首气泡上）；
   跨分钟另起一组并带自己的时间；跨天在组前插一条完整时间条。 */
function renderMessages(force) {
  const box = document.getElementById('messages');
  const key = state.current + '|' + JSON.stringify(state.messages);
  if (key === messagesKey) { scrollBottom(force === undefined ? state.atBottom : !!force); return; }
  messagesKey = key;
  if (!state.current) {
    box.innerHTML = '<div class="empty">还没有私下聊过 —— 左侧选一个人，看你们的来往私信</div>';
    return;
  }
  if (!state.messages.length) {
    box.innerHTML = '<div class="empty">还没有消息。下面可以直接代它发第一条。</div>';
    return;
  }
  const rows = [];
  state.messages.forEach((m, i) => {
    const prev = i > 0 ? state.messages[i - 1] : null;
    const out = m.direction === 'out';
    const first = !sameRun(prev, m);
    const dayBreak = dayChanged(prev, m);
    if (first && minuteChanged(prev, m) && prev) {
      rows.push(`<div class="timesep">${esc(fmtTime(m.ts))}</div>`);
    }
    const who = first ? `<div class="who">${esc(out ? state.aiName : (m.name || '对方'))}</div>` : '';
    const shownAt = dayBreak ? '' : fmtClock(m.ts);
    const stamp = first && (shownAt || out)
      ? `<div class="stamp"><span>${esc(shownAt)}</span>${out ? '<span class="relabel">代发</span>' : ''}</div>`
      : '';
    rows.push(`<div class="line ${out ? 'out' : 'in'}${first ? ' first' : ''}">
      ${first ? avatarHtml(out ? state.aiName : (m.name || '对方'), out) : '<span class="av spacer"></span>'}
      <span class="stack">${who}
        <div class="bubble ${out ? 'out' : 'in'}${first ? ' tail' : ''}">${esc(m.text || '')}${stamp}</div>
      </span>
    </div>`);
  });
  box.innerHTML = rows.join('');
  scrollBottom(force === undefined ? state.atBottom : !!force);
}
function scrollBottom(force) {
  const box = document.getElementById('messages');
  const jump = document.getElementById('jump');
  if (force) { box.scrollTop = box.scrollHeight; state.atBottom = true; }
  if (jump) jump.style.display = state.atBottom ? 'none' : '';
}
function renderPeerHeader() {
  const c = state.contacts.find(sameContact);
  document.getElementById('peerName').textContent = c ? (c.name || c.uuid) : (state.current || '未选择联系人');
  const bits = [];
  if (c && c.tier) bits.push('层级 ' + c.tier);
  if (c) bits.push(c.online ? '在线' : '离线');
  if (c && c.unreplied) bits.push(`未回 ${c.unreplied}`);
  document.getElementById('peerMeta').textContent = bits.join(' · ');
}

/* AI 的名字：查一次 /api/persona（真实数据，不猜）；拿不到就用 "AI"。 */
async function resolveAiName() {
  if (state.aiNameChecked) return;
  state.aiNameChecked = true;
  const { ok, data } = await api('/api/persona');
  if (ok && data && data.name && String(data.name).trim()) {
    state.aiName = String(data.name).trim();
    renderContacts(); renderMessages();
  }
}

/* ── 数据 ── */
async function loadContacts() {
  await resolveAiName();
  const { ok, data } = await api('/api/contacts');
  if (!ok) return;
  state.contacts = Array.isArray(data.contacts) ? data.contacts : [];
  renderContacts();
  renderPeerHeader();
}

async function selectContact(id) {
  state.current = id;
  state.currentKey = id;
  state.atBottom = true;
  renderContacts();
  const { ok, data } = await api(`/api/contacts/${encodeURIComponent(id)}/messages`);
  state.messages = ok && Array.isArray(data.messages) ? data.messages.slice(-MSG_MAX) : [];
  renderMessages(true);
  renderPeerHeader();
  // 进页/切换时清未读。
  try { await api(`/api/contacts/${encodeURIComponent(id)}/read`, {method: 'POST'}); } catch (e) {}
  await loadContacts();
}

async function sendMessage() {
  if (!state.current || state.sending) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  state.sending = true;
  const hint = document.getElementById('sendHint');
  const { data } = await api(`/api/contacts/${encodeURIComponent(state.current)}/send`,
    {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text})});
  state.sending = false;
  if (data && data.status === 'ok') {
    input.value = '';
    hint.textContent = `已以 ${state.aiName} 的身份代发。`;
    hint.style.color = '#8b949e';
    await selectContact(state.current);
  } else {
    const why = (data && (data.blocked || data.reason || data.detail)) || '未知原因';
    hint.textContent = `被服务端拦下了：${why}（白名单未勾选 / 硬黑名单 / 需二次确认）。`;
    hint.style.color = '#f85149';
  }
}

/* 从 /contacts/<uuid> 直接进来时选中那个人。 */
function initialTarget() {
  const parts = location.pathname.replace(/^\/+|\/+$/g, '').split('/');
  return parts[0] === 'contacts' && parts[1] ? decodeURIComponent(parts[1]) : '';
}

/* ── WS 优先，断开退化为轮询；断开不刷屏报错 ── */
let reconnectTimer = null;
const poll = VIS.every(5000, loadContacts);   // 兜底轮询：隐藏时定时器被可见性门停掉
function startPolling() { poll.set(5000); }
function setConn(ok) {
  const el = document.getElementById('conn');
  el.className = 'status ' + (ok ? 'online' : 'offline');
  el.textContent = ok ? '● 已连接' : '● 未连接（轮询中）';
}
let wsRef = null;
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let ws;
  try { ws = new WebSocket(`${proto}//${location.host}/ws`); } catch (e) { setConn(false); startPolling(); return; }
  wsRef = ws;
  ws.onopen = () => setConn(true);
  ws.onmessage = () => { if (VIS.running()) loadContacts(); };
  ws.onerror = () => {};
  ws.onclose = () => {
    setConn(false);
    startPolling();
    scheduleReconnect();
  };
}
function scheduleReconnect() {
  if (reconnectTimer || !VIS.running()) return;   // 隐藏时不空转重连
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    if (VIS.running()) connectWS();
  }, 5000);
}
// 回到可见：断了就立刻接上（不等 5 秒），并补一次刷新。
VIS.onResume(() => {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (!wsRef || wsRef.readyState === WebSocket.CLOSED || wsRef.readyState === WebSocket.CLOSING) connectWS();
  loadContacts();
});

/* 回车发送、Shift+回车换行；滚上去看历史时给"回到最新"按钮，不硬拽。 */
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('messages').addEventListener('scroll', () => {
  const box = document.getElementById('messages');
  state.atBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 60;
  const jump = document.getElementById('jump');
  if (jump) jump.style.display = state.atBottom ? 'none' : '';
});

(async () => {
  await loadContacts();
  const target = initialTarget();
  if (target) await selectContact(target);
  if (VIS.running()) connectWS();   // 隐藏着打开就先不连；VIS.onResume 会接上
})();
</script>
